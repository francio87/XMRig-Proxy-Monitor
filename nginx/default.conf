server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
